<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Rescue AR - Emergency Navigation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
    <div id="app">
        <!-- Splash Screen -->
        <div id="splash" class="splash active">
            <h1>🚨 Rescue AR</h1>
            <p>Navigate Emergencies Smarter</p>
            <button id="startBtn" class="btn-primary">Start Emergency Mode</button>
        </div>

        <!-- Camera/AR View -->
        <div id="arView" class="ar-view hidden">
            <video id="cameraFeed" autoplay playsinline></video>
            <canvas id="arCanvas"></canvas>
            <div id="arOverlay" class="ar-overlay">
                <div id="hazardIndicator" class="hazard hidden">⚠️ Hazard Ahead</div>
                <div id="directionArrow" class="direction-arrow">↑</div>
                <div id="distanceInfo" class="distance-info"></div>
            </div>
        </div>

        <!-- Map View -->
        <div id="mapView" class="map-view hidden">
            <div id="map"></div>
            <div id="mapOverlay">
                <button id="toggleAR" class="float-btn">📷 AR Mode</button>
                <button id="sosBtn" class="sos-btn">🆘 SOS</button>
            </div>
        </div>

        <!-- SOS Panel -->
        <div id="sosPanel" class="sos-panel hidden">
            <h2>🚨 EMERGENCY SOS</h2>
            <p id="locationStatus">Getting your location...</p>
            <button id="sendSOS">Send Emergency Alert</button>
            <button id="closeSOS">Close</button>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@tensorflow-models/coco-ssd"></script>
    <script src="js/app.js"></script>
</body>
</html>

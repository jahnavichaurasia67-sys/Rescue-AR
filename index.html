<!DOCTYPE html>
<html>
<head>
  <title>Rescue AR - WebAR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body style="margin:0; overflow:hidden;">

<!-- 🔥 UI OVERLAY -->
<div class="ui">
  <div id="panel">
    <p id="location">📍 Location: loading...</p>
    <p id="hospital">🏥 Hospital: searching...</p>
    <p id="distance">📏 Distance: --</p>
    <p id="direction">🧭 Direction: --</p>
    <p id="heading">🧭 Heading: 0°</p>
  </div>
</div>

<!-- 🔥 REAL AR SCENE -->
<a-scene embedded arjs>

  <!-- CAMERA -->
  <a-entity camera></a-entity>

  <!-- 🏥 AR HOSPITAL MARKER -->
  <a-entity
    id="arMarker"
    geometry="primitive: cone; radiusBottom: 0.5; height: 1"
    material="color: red"
    position="0 0 -3"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
  </a-entity>

  <!-- 📍 AR TARGET GLOW -->
  <a-entity
    geometry="primitive: ring; radiusInner: 0.5; radiusOuter: 0.8"
    material="color: yellow; shader: flat"
    position="0 0 -4"
    animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1200">
  </a-entity>

</a-scene>

<script src="script.js"></script>

</body>
</html>

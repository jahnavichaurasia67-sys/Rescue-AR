<!DOCTYPE html>
<html>
<head>
  <title>Rescue AR - Google Maps Style AR</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body style="margin:0; overflow:hidden;">

<!-- 🔥 UI PANEL -->
<div class="ui">
  <div id="panel">
    <p id="location">📍 Location: loading...</p>
    <p id="hospital">🏥 Hospital: searching...</p>
    <p id="distance">📏 Distance: --</p>
    <p id="direction">🧭 Direction: --</p>
    <p id="heading">🧭 Heading: 0°</p>
  </div>
</div>

<!-- 🔥 REAL AR SCENE -->
<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <!-- CAMERA -->
  <a-entity camera></a-entity>

  <!-- 🧭 AR ARROW (MAIN OBJECT) -->
  <a-entity
    id="arrow"
    geometry="primitive: cone; radiusBottom: 0.3; height: 1"
    material="color: #00ffcc"
    position="0 0 -3"
    rotation="0 0 0"
    animation="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1200">
  </a-entity>

</a-scene>

<script src="script.js"></script>

</body>
</html>

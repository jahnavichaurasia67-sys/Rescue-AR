<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rescue AR - Advanced AR Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a2a, #1a1a3e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            color: white;
        }

        .logo {
            font-size: 5rem;
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin: 1rem 0;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            -webkit-back-ground-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-primary {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 2rem;
            font-weight: bold;
        }

        /* Main App */
        #mainApp {
            display: none;
            width: 100%;
            height: 100vh;
        }

        /* AR View */
        .ar-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #arCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ar-overlay {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .direction-arrow {
            font-size: 4rem;
            filter: drop-shadow(0 0 10px #2ecc71);
            animation: bounce 1s infinite;
            display: inline-block;
        }

        .distance-info {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            color: white;
        }

        .hazard-alert {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            padding: 12px 24px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            z-index: 20;
            white-space: nowrap;
            animation: shake 0.5s;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 15;
        }

        .exit-ar, .sos-ar {
            padding: 12px 20px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .sos-ar {
            background: rgba(231, 76, 60, 0.9);
        }

        /* Map View */
        .map-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 500;
        }

        .ar-btn, .map-sos {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }

        .ar-btn {
            background: #3498db;
            color: white;
        }

        .map-sos {
            background: #e74c3c;
            color: white;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 500;
            text-align: center;
            color: white;
        }

        /* SOS Panel */
        .sos-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 350px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            z-index: 2000;
            text-align: center;
            display: none;
        }

        .sos-panel h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }

        .sos-btn-large {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            margin-top: 15px;
            width: 100%;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) translateX(0); }
            25% { transform: translateX(-50%) translateX(-10px); }
            75% { transform: translateX(-50%) translateX(10px); }
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
    <div class="logo">🚨</div>
    <h1>Rescue AR</h1>
    <p>AI-Powered Emergency Navigation</p>
    <button class="btn-primary" id="startBtn">🎯 Start AR Rescue</button>
    <p style="font-size: 11px; margin-top: 20px;">Camera + Location required | AI detects hazards in real-time</p>
</div>

<!-- Main App -->
<div id="mainApp">
    <!-- Map View -->
    <div class="map-container" id="mapView">
        <div id="map"></div>
        <div class="status-bar" id="statusBar">📍 Getting your location...</div>
        <div class="map-controls">
            <button class="ar-btn" id="arModeBtn">📷 AR Mode</button>
            <button class="map-sos" id="sosBtn">🆘 SOS</button>
        </div>
    </div>

    <!-- AR View -->
    <div class="ar-container" id="arView" style="display: none;">
        <video id="cameraFeed" autoplay playsinline muted></video>
        <canvas id="arCanvas"></canvas>
        <div class="ar-overlay">
            <div class="direction-arrow" id="directionArrow">⬆️</div>
            <div class="distance-info" id="distanceInfo">Scanning for hazards...</div>
        </div>
        <div class="controls">
            <button class="exit-ar" id="exitArBtn">← Exit</button>
            <button class="sos-ar" id="arSosBtn">🆘 SOS</button>
        </div>
    </div>

    <!-- SOS Panel -->
    <div class="sos-panel" id="sosPanel">
        <h2>🆘 EMERGENCY SOS</h2>
        <p id="sosLocationText">Getting location...</p>
        <div id="emergencyNumbers" style="text-align: left; margin: 15px 0;">
            <p>📞 Police: 112</p>
            <p>🚑 Ambulance: 102</p>
            <p>🔥 Fire: 101</p>
            <p>🇮🇳 National: 112</p>
        </div>
        <button class="sos-btn-large" id="sendSosBtn">📨 SEND ALERT</button>
        <button id="closeSosBtn" style="margin-top: 10px; padding: 10px; background: #ccc; border: none; border-radius: 10px; width: 100%;">Close</button>
    </div>
</div>

<script>
    // ===== RESCUE AR - WITH REAL TENSORFLOW HAZARD DETECTION =====
    
    // DOM Elements
    const splash = document.getElementById('splash');
    const mainApp = document.getElementById('mainApp');
    const startBtn = document.getElementById('startBtn');
    const arModeBtn = document.getElementById('arModeBtn');
    const exitArBtn = document.getElementById('exitArBtn');
    const sosBtn = document.getElementById('sosBtn');
    const arSosBtn = document.getElementById('arSosBtn');
    const sendSosBtn = document.getElementById('sendSosBtn');
    const closeSosBtn = document.getElementById('closeSosBtn');
    const sosPanel = document.getElementById('sosPanel');
    const mapView = document.getElementById('mapView');
    const arView = document.getElementById('arView');
    
    // State
    let userLocation = null;
    let map = null;
    let userMarker = null;
    let watchId = null;
    let arActive = false;
    let cameraStream = null;
    let currentHeading = 0;
    let emergencyServices = [];
    let objectModel = null;
    let detectionInterval = null;
    let lastHazardTime = 0;
    
    // Start button
    startBtn.onclick = async () => {
        try {
            // Get location
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            });
            
            userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                accuracy: position.coords.accuracy
            };
            
            splash.style.display = 'none';
            mainApp.style.display = 'block';
            
            initMap();
            startLocationTracking();
            findNearbyServices();
            loadAIModel(); // Load TensorFlow model in background
            
            document.getElementById('statusBar').innerHTML = `📍 Ready at ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`;
            
        } catch(error) {
            alert('Please enable location access in Chrome settings');
        }
    };
    
    // Load AI Model
    async function loadAIModel() {
        try {
            document.getElementById('statusBar').innerHTML += ' | 🤖 Loading AI...';
            objectModel = await cocoSsd.load();
            console.log('✅ AI Model loaded');
            document.getElementById('statusBar').innerHTML = document.getElementById('statusBar').innerHTML.replace(' | 🤖 Loading AI...', ' | ✅ AI Ready');
        } catch(e) {
            console.log('AI model load failed, continuing without detection');
        }
    }
    
    // Initialize Map
    function initMap() {
        if (!userLocation) return;
        
        map = L.map('map').setView([userLocation.lat, userLocation.lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        userMarker = L.marker([userLocation.lat, userLocation.lng], {
            icon: L.divIcon({ html: '🧑‍🦯', iconSize: [30, 30] })
        }).addTo(map);
        
        L.circle([userLocation.lat, userLocation.lng], {
            radius: userLocation.accuracy || 50,
            color: '#3498db',
            fillColor: '#3498db',
            fillOpacity: 0.1
        }).addTo(map);
    }
    
    // Location Tracking
    function startLocationTracking() {
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    heading: position.coords.heading
                };
                
                if (userMarker && map) {
                    userMarker.setLatLng([userLocation.lat, userLocation.lng]);
                    map.setView([userLocation.lat, userLocation.lng], 17);
                }
                
                if (arActive) updateARDirection();
            },
            (error) => console.log('GPS error'),
            { enableHighAccuracy: true }
        );
    }
    
    // Find nearby emergency services
    async function findNearbyServices() {
        // Dummy emergency services for demo
        if (!userLocation) return;
        
        const services = [
            { name: 'City Hospital', lat: userLocation.lat + 0.002, lon: userLocation.lng + 0.0015, type: '🏥' },
            { name: 'Fire Station', lat: userLocation.lat - 0.0015, lon: userLocation.lng + 0.002, type: '🚒' },
            { name: 'Police Station', lat: userLocation.lat + 0.001, lon: userLocation.lng - 0.002, type: '👮' },
            { name: 'Emergency Shelter', lat: userLocation.lat - 0.002, lon: userLocation.lng - 0.001, type: '🏠' }
        ];
        
        services.forEach(s => {
            const marker = L.marker([s.lat, s.lon], {
                icon: L.divIcon({ html: s.type, iconSize: [25, 25] })
            }).addTo(map);
            marker.bindPopup(`<b>${s.name}</b>`);
            emergencyServices.push({ lat: s.lat, lon: s.lon, name: s.name });
        });
        
        document.getElementById('statusBar').innerHTML = `📍 ${emergencyServices.length} emergency services nearby`;
    }
    
    // AR Mode with TensorFlow Detection
    arModeBtn.onclick = async () => {
        mapView.style.display = 'none';
        arView.style.display = 'block';
        arActive = true;
        
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            
            const video = document.getElementById('cameraFeed');
            video.srcObject = cameraStream;
            await video.play();
            
            // Start object detection
            if (objectModel) {
                startObjectDetection();
            }
            
            // Orientation tracking
            window.addEventListener('deviceorientation', (e) => {
                if (e.alpha) currentHeading = 360 - e.alpha;
            });
            
            updateARDirection();
            
        } catch(error) {
            alert('Camera access needed for AR mode');
            exitARMode();
        }
    };
    
    // TensorFlow Object Detection
    function startObjectDetection() {
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('arCanvas');
        const ctx = canvas.getContext('2d');
        
        detectionInterval = setInterval(async () => {
            if (!objectModel || !video.videoWidth || !arActive) return;
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const predictions = await objectModel.detect(video);
            
            // Hazardous objects to detect
            const hazards = ['person', 'chair', 'bottle', 'tv', 'book', 'dining table'];
            let hazardDetected = false;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            predictions.forEach(pred => {
                if (hazards.includes(pred.class) && pred.score > 0.6) {
                    hazardDetected = true;
                    
                    // Draw red bounding box
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pred.bbox[0], pred.bbox[1], pred.bbox[2], pred.bbox[3]);
                    
                    // Draw label
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = '16px Arial';
                    ctx.fillText(`⚠️ ${pred.class}`, pred.bbox[0], pred.bbox[1] - 5);
                    
                    // Show hazard alert
                    const now = Date.now();
                    if (now - lastHazardTime > 3000) {
                        lastHazardTime = now;
                        showHazardAlert(`⚠️ ${pred.class} detected ahead!`);
                        // Try to vibrate if supported
                        if (navigator.vibrate) navigator.vibrate(500);
                    }
                }
            });
            
        }, 300);
    }
    
    function showHazardAlert(message) {
        const existing = document.querySelector('.hazard-alert');
        if (existing) existing.remove();
        
        const alert = document.createElement('div');
        alert.className = 'hazard-alert';
        alert.innerHTML = message;
        document.querySelector('.ar-container').appendChild(alert);
        
        setTimeout(() => alert.remove(), 3000);
    }
    
    // AR Direction Logic
    function updateARDirection() {
        if (!arActive || !userLocation || emergencyServices.length === 0) {
            if (arActive) setTimeout(updateARDirection, 200);
            return;
        }
        
        // Find nearest emergency service
        let nearest = null;
        let minDistance = Infinity;
        
        emergencyServices.forEach(service => {
            const R = 6371e3;
            const φ1 = userLocation.lat * Math.PI/180;
            const φ2 = service.lat * Math.PI/180;
            const Δφ = (service.lat - userLocation.lat) * Math.PI/180;
            const Δλ = (service.lon - userLocation.lng) * Math.PI/180;
            
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;
            
            if (distance < minDistance) {
                minDistance = distance;
                nearest = service;
            }
        });
        
        const arrow = document.getElementById('directionArrow');
        const distanceInfo = document.getElementById('distanceInfo');
        
        if (minDistance < 30) {
            arrow.innerHTML = '📍';
            distanceInfo.innerHTML = `✅ ARRIVED at ${nearest.name}`;
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        } else if (minDistance < 100) {
            arrow.innerHTML = '⬆️⬆️';
            distanceInfo.innerHTML = `${Math.round(minDistance)}m - VERY CLOSE!`;
            arrow.style.animation = 'pulse 0.5s infinite';
        } else {
            arrow.innerHTML = '⬆️';
            distanceInfo.innerHTML = `${Math.round(minDistance)}m to ${nearest.name}`;
            arrow.style.animation = 'bounce 1s infinite';
        }
        
        if (arActive) setTimeout(updateARDirection, 500);
    }
    
    function exitARMode() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
        }
        if (detectionInterval) clearInterval(detectionInterval);
        arActive = false;
        arView.style.display = 'none';
        mapView.style.display = 'block';
    }
    
    exitArBtn.onclick = exitARMode;
    
    // SOS Functions
    function showSOS() {
        if (userLocation) {
            document.getElementById('sosLocationText').innerHTML = `
                📍 ${userLocation.lat.toFixed(6)}, ${userLocation.lng.toFixed(6)}<br>
                <a href="https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}" target="_blank">
                Open in Google Maps →</a>
            `;
        }
        sosPanel.style.display = 'block';
    }
    
    sosBtn.onclick = showSOS;
    arSosBtn.onclick = showSOS;
    
    sendSosBtn.onclick = () => {
        if (userLocation) {
            const msg = `🚨 RESCUE AR EMERGENCY! 🚨\nLocation: https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`;
            window.location.href = `sms:112?body=${encodeURIComponent(msg)}`;
            alert('SOS alert ready - sending message');
        }
        sosPanel.style.display = 'none';
    };
    
    closeSosBtn.onclick = () => sosPanel.style.display = 'none';
    
    console.log('✅ Rescue AR with AI Hazard Detection ready!');
</script>
</body>
</html>
